<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Control NEMA 17 - TB6600</title>

    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: #f0f2f5;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
        }

        .container {
            background: white;
            width: 100%;
            max-width: 480px;
            padding: 30px;
            border-radius: 16px;
            box-shadow: 0 8px 24px rgba(0, 0, 0, 0.12);
        }

        h1 {
            text-align: center;
            font-size: 24px;
            color: #1a1a1a;
            margin-bottom: 6px;
        }

        .subtitle {
            text-align: center;
            color: #666;
            font-size: 14px;
            margin-bottom: 25px;
        }

        .connection-box {
            display: flex;
            gap: 10px;
            margin-bottom: 25px;
        }

        button {
            flex: 1;
            padding: 12px 16px;
            border: none;
            border-radius: 8px;
            font-size: 15px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.2s ease;
        }

        #connectBtn {
            background: #1a73e8;
            color: white;
        }

        #connectBtn:hover {
            background: #1557b0;
        }

        #disconnectBtn {
            background: #d93025;
            color: white;
        }

        #disconnectBtn:hover {
            background: #a50e0e;
        }

        button:disabled {
            background: #e0e0e0 !important;
            color: #a0a0a0 !important;
            cursor: not-allowed;
            box-shadow: none;
        }

        .control-group {
            margin-bottom: 20px;
        }

        label {
            display: block;
            margin-bottom: 8px;
            font-weight: 600;
            color: #333;
            font-size: 14px;
        }

        input[type="number"] {
            width: 100%;
            padding: 12px 14px;
            border: 2px solid #ddd;
            border-radius: 8px;
            font-size: 18px;
            text-align: center;
            font-weight: bold;
            outline: none;
            transition: border-color 0.2s;
        }

        input[type="number"]:focus {
            border-color: #1a73e8;
        }

        .quick-buttons {
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            gap: 8px;
            margin-top: 10px;
        }

        .btn-quick {
            background: #e8f0fe;
            color: #1a73e8;
            padding: 8px;
            font-size: 13px;
        }

        .btn-quick:hover {
            background: #d2e3fc;
        }

        #rotateBtn {
            width: 100%;
            padding: 15px;
            background: #34a853;
            color: white;
            font-size: 16px;
            margin-top: 10px;
            border-radius: 8px;
        }

        #rotateBtn:hover {
            background: #2d8e47;
        }

        .status-box {
            margin-top: 25px;
            padding: 12px 16px;
            border-radius: 8px;
            background: #f8f9fa;
            border: 1px solid #e9ecef;
            font-family: monospace;
            font-size: 13px;
            color: #495057;
            min-height: 50px;
            display: flex;
            align-items: center;
            justify-content: center;
            text-align: center;
        }
    </style>
</head>

<body>

    <div class="container">

        <h1>Control NEMA 17 (TB6600)</h1>
        <p class="subtitle">Prueba de 1 Eje - Comunicación Serial</p>

        <!-- BOTONES DE CONEXIÓN -->
        <div class="connection-box">
            <button id="connectBtn">Conectar Serial</button>
            <button id="disconnectBtn" disabled>Desconectar</button>
        </div>

        <!-- CONTROL NUMÉRICO -->
        <div class="control-group">
            <label for="degreesInput">Grados a girar (Positivos / Negativos):</label>
            <input type="number" id="degreesInput" value="90" step="1" disabled>

            <!-- ACCESOS RÁPIDOS -->
            <div class="quick-buttons">
                <button class="btn-quick" onclick="setDegrees(45)" disabled>+45°</button>
                <button class="btn-quick" onclick="setDegrees(90)" disabled>+90°</button>
                <button class="btn-quick" onclick="setDegrees(180)" disabled>+180°</button>
                <button class="btn-quick" onclick="setDegrees(-90)" disabled>-90°</button>
            </div>
        </div>

        <!-- BOTÓN EJECUTAR -->
        <button id="rotateBtn" disabled>Girar Motor</button>

        <!-- TERMINAL DE ESTADO -->
        <div class="status-box" id="statusText">
            Estado: Desconectado
        </div>

    </div>

    <script>
        let port = null;
        let writer = null;
        let reader = null;
        let keepReading = true;

        // ELEMENTOS DOM
        const connectBtn = document.getElementById("connectBtn");
        const disconnectBtn = document.getElementById("disconnectBtn");
        const rotateBtn = document.getElementById("rotateBtn");
        const degreesInput = document.getElementById("degreesInput");
        const statusText = document.getElementById("statusText");
        const quickBtns = document.querySelectorAll(".btn-quick");

        // ESTADO DE INTERFAZ
        function setControlsState(enabled) {
            connectBtn.disabled = enabled;
            disconnectBtn.disabled = !enabled;
            rotateBtn.disabled = !enabled;
            degreesInput.disabled = !enabled;
            quickBtns.forEach(btn => btn.disabled = !enabled);
        }

        // ACCESO RÁPIDO A GRADOS
        function setDegrees(val) {
            degreesInput.value = val;
        }

        // CONECTAR ARDUINO
        connectBtn.addEventListener("click", async () => {
            try {
                port = await navigator.serial.requestPort();
                await port.open({ baudRate: 9600 });

                writer = port.writable.getWriter();
                keepReading = true;

                setControlsState(true);
                statusText.textContent = "Conectado a Arduino";

                // Iniciar lectura en segundo plano
                readFromArduino();

            } catch (error) {
                console.error("Error al conectar:", error);
                statusText.textContent = "Error al conectar con el puerto";
            }
        });

        // ENVIAR COMANDO DE GIRO
        rotateBtn.addEventListener("click", async () => {
            if (!writer) return;

            const degrees = degreesInput.value;

            if (degrees === "" || isNaN(degrees)) {
                statusText.textContent = "Por favor ingresa un número válido";
                return;
            }

            try {
                const data = new TextEncoder().encode(degrees + "\n");
                await writer.write(data);
                statusText.textContent = "Comando enviado: " + degrees + "°";
            } catch (error) {
                console.error("Error al enviar:", error);
                statusText.textContent = "Error de comunicación al enviar";
            }
        });

        // LECTURA DESDE ARDUINO
        async function readFromArduino() {
            const textDecoder = new TextDecoderStream();
            const readableStreamClosed = port.readable.pipeTo(textDecoder.writable);
            reader = textDecoder.readable.getReader();

            try {
                while (keepReading) {
                    const { value, done } = await reader.read();
                    if (done) {
                        reader.releaseLock();
                        break;
                    }
                    if (value) {
                        statusText.textContent = "Arduino: " + value.trim();
                    }
                }
            } catch (error) {
                console.error("Error en lectura:", error);
            }
        }

        // DESCONECTAR ARDUINO
        disconnectBtn.addEventListener("click", async () => {
            try {
                keepReading = false;

                if (reader) {
                    await reader.cancel();
                    reader = null;
                }

                if (writer) {
                    writer.releaseLock();
                    writer = null;
                }

                if (port) {
                    await port.close();
                    port = null;
                }

                setControlsState(false);
                statusText.textContent = "Estado: Desconectado";

            } catch (error) {
                console.error("Error al desconectar:", error);
                statusText.textContent = "Error al desconectar";
            }
        });
    </script>

</body>
</html>
