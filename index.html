<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Control Cinemático - Brazo Robótico</title>

    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: #f0f2f5;
            min-height: 100vh;
            padding: 20px;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        .main-container {
            width: 100%;
            max-width: 1000px;
            background: white;
            padding: 25px;
            border-radius: 16px;
            box-shadow: 0 8px 24px rgba(0,0,0,0.12);
        }

        h1 {
            text-align: center;
            margin-bottom: 5px;
            color: #1a1a1a;
        }

        .subtitle {
            text-align: center;
            color: #666;
            margin-bottom: 20px;
            font-size: 14px;
        }

        .top-bar {
            display: flex;
            gap: 10px;
            margin-bottom: 20px;
        }

        .grid-layout {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 20px;
        }

        @media (max-width: 768px) {
            .grid-layout {
                grid-template-columns: 1fr;
            }
        }

        .panel {
            background: #f8f9fa;
            border: 1px solid #e9ecef;
            border-radius: 12px;
            padding: 20px;
        }

        .panel-title {
            font-size: 18px;
            font-weight: bold;
            margin-bottom: 15px;
            color: #2b3a4a;
            border-bottom: 2px solid #ddd;
            padding-bottom: 8px;
        }

        .input-group {
            display: flex;
            gap: 10px;
            margin-bottom: 15px;
        }

        .coord-field {
            flex: 1;
        }

        .coord-field label {
            display: block;
            font-weight: bold;
            margin-bottom: 5px;
            font-size: 13px;
            color: #444;
        }

        input[type="number"] {
            width: 100%;
            padding: 10px;
            border: 1px solid #ccc;
            border-radius: 6px;
            font-size: 16px;
            text-align: center;
            font-weight: bold;
        }

        button {
            width: 100%;
            padding: 12px;
            border: none;
            border-radius: 8px;
            font-size: 14px;
            font-weight: bold;
            cursor: pointer;
            transition: all 0.2s;
            margin-bottom: 10px;
        }

        #connectBtn { background: #1a73e8; color: white; }
        #disconnectBtn { background: #d93025; color: white; }
        #moveBtn { background: #2e7d32; color: white; }
        #homeBtn { background: #f57c00; color: white; }
        #freeBtn { background: #616161; color: white; }

        #recordBtn { background: #0288d1; color: white; }
        #runSeqBtn { background: #388e3c; color: white; }
        #stopSeqBtn { background: #c62828; color: white; }
        #clearSeqBtn { background: #757575; color: white; }

        button:disabled {
            background: #e0e0e0 !important;
            color: #a0a0a0 !important;
            cursor: not-allowed;
        }

        .sequence-list {
            background: white;
            border: 1px solid #ccc;
            border-radius: 8px;
            max-height: 220px;
            overflow-y: auto;
            margin-bottom: 15px;
            padding: 5px;
        }

        .seq-item {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 8px 12px;
            border-bottom: 1px solid #eee;
            font-family: monospace;
            font-size: 14px;
        }

        .seq-item:last-child {
            border-bottom: none;
        }

        .btn-delete-item {
            background: #d93025;
            color: white;
            width: 24px;
            height: 24px;
            border-radius: 50%;
            padding: 0;
            font-size: 16px;
            line-height: 20px;
            margin: 0;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        .status-box {
            margin-top: 15px;
            padding: 12px;
            background: #2b3a4a;
            color: #38ef7d;
            font-family: monospace;
            border-radius: 8px;
            text-align: center;
            font-size: 14px;
            min-height: 45px;
            display: flex;
            align-items: center;
            justify-content: center;
        }
    </style>
</head>

<body>

    <div class="main-container">

        <h1>Interfaz Brazo Robótico</h1>
        <p class="subtitle">Control Cinemático Directo y Generador de Secuencias</p>

        <!-- BARRA SUPERIOR DE CONEXIÓN -->
        <div class="top-bar">
            <button id="connectBtn">Conectar Serial</button>
            <button id="disconnectBtn" disabled>Desconectar</button>
        </div>

        <div class="grid-layout">

            <!-- PANEL DE CONTROL DIRECTO -->
            <div class="panel">
                <div class="panel-title">Control Directo (XYZ)</div>

                <div class="input-group">
                    <div class="coord-field">
                        <label for="inputX">X (mm)</label>
                        <input type="number" id="inputX" value="130" disabled>
                    </div>
                    <div class="coord-field">
                        <label for="inputY">Y (mm)</label>
                        <input type="number" id="inputY" value="185" disabled>
                    </div>
                    <div class="coord-field">
                        <label for="inputZ">Z (mm)</label>
                        <input type="number" id="inputZ" value="-130" disabled>
                    </div>
                </div>

                <button id="moveBtn" disabled>Ejecutar Coordenadas</button>
                <button id="homeBtn" disabled>Ir a Posición Inicial (Home)</button>
                <button id="freeBtn" disabled>Liberar / Habilitar Motores</button>
            </div>

            <!-- PANEL DE SECUENCIA / PARCIALES -->
            <div class="panel">
                <div class="panel-title">Panel de Secuencia</div>

                <div class="sequence-list" id="sequenceContainer">
                    <div style="text-align: center; color: #888; padding: 20px;" id="emptyMsg">
                        No hay puntos guardados
                    </div>
                </div>

                <div class="input-group">
                    <div class="coord-field" style="flex: 2;">
                        <label for="intervalInput">Tiempo de espera (seg):</label>
                        <input type="number" id="intervalInput" value="2" min="1" disabled>
                    </div>
                </div>

                <button id="recordBtn" disabled>Grabar Posición Parcial</button>
                <button id="runSeqBtn" disabled>Ejecutar Secuencia</button>
                <button id="stopSeqBtn" style="display: none;">Detener Secuencia</button>
                <button id="clearSeqBtn" disabled>Borrar Toda la Secuencia</button>
            </div>

        </div>

        <!-- TERMINAL DE ESTADO -->
        <div class="status-box" id="statusText">
            Estado: Desconectado
        </div>

    </div>

    <script>
        let port = null;
        let writer = null;
        let reader = null;
        let keepReading = true;
        let sequence = [];
        let isExecutingSeq = false;
        let stopRequested = false;

        // ELEMENTOS DOM
        const connectBtn = document.getElementById("connectBtn");
        const disconnectBtn = document.getElementById("disconnectBtn");
        const moveBtn = document.getElementById("moveBtn");
        const homeBtn = document.getElementById("homeBtn");
        const freeBtn = document.getElementById("freeBtn");

        const recordBtn = document.getElementById("recordBtn");
        const runSeqBtn = document.getElementById("runSeqBtn");
        const stopSeqBtn = document.getElementById("stopSeqBtn");
        const clearSeqBtn = document.getElementById("clearSeqBtn");

        const inputX = document.getElementById("inputX");
        const inputY = document.getElementById("inputY");
        const inputZ = document.getElementById("inputZ");
        const intervalInput = document.getElementById("intervalInput");

        const sequenceContainer = document.getElementById("sequenceContainer");
        const emptyMsg = document.getElementById("emptyMsg");
        const statusText = document.getElementById("statusText");

        // HABILITAR / DESHABILITAR INTERFAZ
        function setControlsState(enabled) {
            connectBtn.disabled = enabled;
            disconnectBtn.disabled = !enabled;
            moveBtn.disabled = !enabled;
            homeBtn.disabled = !enabled;
            freeBtn.disabled = !enabled;
            recordBtn.disabled = !enabled;
            runSeqBtn.disabled = !enabled || sequence.length === 0;
            clearSeqBtn.disabled = !enabled || sequence.length === 0;

            inputX.disabled = !enabled;
            inputY.disabled = !enabled;
            inputZ.disabled = !enabled;
            intervalInput.disabled = !enabled;
        }

        // CONECTAR ARDUINO
        connectBtn.addEventListener("click", async () => {
            try {
                port = await navigator.serial.requestPort();
                await port.open({ baudRate: 9600 });

                writer = port.writable.getWriter();
                keepReading = true;

                setControlsState(true);
                statusText.textContent = "Estado: Conectado";

                readFromArduino();

            } catch (error) {
                console.error("Error al conectar:", error);
                statusText.textContent = "Error al conectar puerto serie";
            }
        });

        // ENVIAR COMANDO A ARDUINO
        async function sendCommand(cmd) {
            if (!writer) return;
            try {
                const data = new TextEncoder().encode(cmd + "\n");
                await writer.write(data);
            } catch (err) {
                console.error("Error al enviar comando:", err);
                statusText.textContent = "Error de transmisión";
            }
        }

        // ACCIONES DE BOTONES DIRECTOS
        moveBtn.addEventListener("click", () => {
            const x = inputX.value;
            const y = inputY.value;
            const z = inputZ.value;
            sendCommand(`MOVE:${x},${y},${z}`);
            statusText.textContent = `Enviando movimiento: X:${x} Y:${y} Z:${z}`;
        });

        homeBtn.addEventListener("click", () => {
            sendCommand("HOME");
            statusText.textContent = "Enviando orden a Home...";
        });

        freeBtn.addEventListener("click", () => {
            sendCommand("TOGGLE_ENABLE");
            statusText.textContent = "Cambiando estado de motores...";
        });

        // LECTURA DESDE ARDUINO
        async function readFromArduino() {
            const textDecoder = new TextDecoderStream();
            const readableStreamClosed = port.readable.pipeTo(textDecoder.writable);
            reader = textDecoder.readable.getReader();

            try {
                while (keepReading) {
                    const { value, done } = await reader.read();
                    if (done) {
                        reader.releaseLock();
                        break;
                    }
                    if (value) {
                        const msg = value.trim();
                        if (msg) statusText.textContent = "Arduino: " + msg;
                    }
                }
            } catch (error) {
                console.error("Error en lectura:", error);
            }
        }

        // --- GESTIÓN DE SECUENCIAS (PARCIALES) ---

        function renderSequence() {
            sequenceContainer.innerHTML = "";

            if (sequence.length === 0) {
                sequenceContainer.appendChild(emptyMsg);
                runSeqBtn.disabled = true;
                clearSeqBtn.disabled = true;
                return;
            }

            if (port) {
                runSeqBtn.disabled = false;
                clearSeqBtn.disabled = false;
            }

            sequence.forEach((pt, index) => {
                const item = document.createElement("div");
                item.className = "seq-item";
                item.innerHTML = `
                    <span><strong>#${index + 1}</strong> -> X: ${pt.x}, Y: ${pt.y}, Z: ${pt.z}</span>
                    <button class="btn-delete-item" onclick="deletePoint(${index})">-</button>
                `;
                sequenceContainer.appendChild(item);
            });
        }

        recordBtn.addEventListener("click", () => {
            const pt = {
                x: inputX.value,
                y: inputY.value,
                z: inputZ.value
            };
            sequence.push(pt);
            renderSequence();
            statusText.textContent = `Punto #${sequence.length} grabado`;
        });

        function deletePoint(index) {
            sequence.splice(index, 1);
            renderSequence();
            statusText.textContent = `Punto borrado`;
        }

        clearSeqBtn.addEventListener("click", () => {
            sequence = [];
            renderSequence();
            statusText.textContent = "Secuencia borrada por completo";
        });

        // EJECUCIÓN PASO A PASO DE LA SECUENCIA
        runSeqBtn.addEventListener("click", async () => {
            if (sequence.length === 0 || isExecutingSeq) return;

            isExecutingSeq = true;
            stopRequested = false;

            runSeqBtn.style.display = "none";
            stopSeqBtn.style.display = "block";
            setControlsState(false);
            disconnectBtn.disabled = true;

            const intervalSec = parseFloat(intervalInput.value) || 2;

            for (let i = 0; i < sequence.length; i++) {
                if (stopRequested) {
                    statusText.textContent = "Secuencia detenida por el usuario";
                    break;
                }

                const pt = sequence[i];
                statusText.textContent = `Ejecutando Punto #${i + 1} de ${sequence.length} (X:${pt.x}, Y:${pt.y}, Z:${pt.z})`;
                sendCommand(`MOVE:${pt.x},${pt.y},${pt.z}`);

                // Tiempo de espera para que el robot se mueva + tiempo de pausa asignado por el usuario
                await new Promise(r => setTimeout(r, (intervalSec * 1000) + 2000));
            }

            isExecutingSeq = false;
            runSeqBtn.style.display = "block";
            stopSeqBtn.style.display = "none";
            setControlsState(true);
            if (!stopRequested) statusText.textContent = "Secuencia completada con éxito";
        });

        stopSeqBtn.addEventListener("click", () => {
            stopRequested = true;
        });

        // DESCONECTAR
        disconnectBtn.addEventListener("click", async () => {
            try {
                keepReading = false;

                if (reader) {
                    await reader.cancel();
                    reader = null;
                }

                if (writer) {
                    writer.releaseLock();
                    writer = null;
                }

                if (port) {
                    await port.close();
                    port = null;
                }

                setControlsState(false);
                statusText.textContent = "Estado: Desconectado";

            } catch (error) {
                console.error("Error al desconectar:", error);
                statusText.textContent = "Error al desconectar";
            }
        });
    </script>

</body>
</html>
