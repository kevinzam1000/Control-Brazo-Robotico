<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Control de brillo Arduino</title>

    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: Arial, sans-serif;
            background: #f4f6f8;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        .container {
            background: white;
            width: 90%;
            max-width: 500px;
            padding: 35px;
            border-radius: 15px;
            box-shadow: 0 5px 20px rgba(0, 0, 0, 0.1);
        }

        h1 {
            text-align: center;
            margin-bottom: 10px;
            color: #222;
        }

        .description {
            text-align: center;
            color: #666;
            margin-bottom: 30px;
        }

        .control {
            margin-bottom: 25px;
        }

        label {
            display: block;
            margin-bottom: 8px;
            font-weight: bold;
            color: #333;
        }

        input[type="number"] {
            width: 100%;
            padding: 12px;
            border: 1px solid #ccc;
            border-radius: 8px;
            font-size: 16px;
        }

        input[type="range"] {
            width: 100%;
            margin-top: 10px;
            cursor: pointer;
        }

        button {
            width: 100%;
            padding: 14px;
            margin-top: 10px;
            border: none;
            border-radius: 8px;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
        }

        #connectButton {
            background: #222;
            color: white;
        }

        #disconnectButton {
            background: #c62828;
            color: white;
        }

        button:disabled {
            background: #ccc !important;
            cursor: not-allowed;
        }

        .value {
            text-align: center;
            font-size: 20px;
            font-weight: bold;
            margin-top: 10px;
        }

        .status {
            margin-top: 25px;
            padding: 12px;
            border-radius: 8px;
            background: #eee;
            color: #555;
            text-align: center;
        }
    </style>
</head>

<body>

    <div class="container">

        <h1>Control de brillo</h1>

        <p class="description">
            Control PWM del LED mediante comunicación serial
        </p>

        <!-- CONEXIÓN -->
        <button id="connectButton">
            Conectar Arduino
        </button>

        <!-- VALOR NUMÉRICO -->
        <div class="control">
            <label for="brightnessInput">
                Nivel de brillo (0 - 255)
            </label>

            <input
                type="number"
                id="brightnessInput"
                min="0"
                max="255"
                value="128"
                disabled
            >
        </div>

        <!-- BARRA -->
        <div class="control">

            <label for="brightnessSlider">
                Control de brillo
            </label>

            <input
                type="range"
                id="brightnessSlider"
                min="0"
                max="255"
                value="128"
                disabled
            >

            <div class="value">
                <span id="brightnessValue">128</span>
            </div>

        </div>

        <!-- DESCONECTAR -->
        <button id="disconnectButton" disabled>
            Desconectar Arduino
        </button>

        <!-- ESTADO -->
        <div class="status" id="status">
            Arduino desconectado
        </div>

    </div>

    <script>
        let port = null;
        let writer = null;

        // ELEMENTOS
        const connectButton = document.getElementById("connectButton");
        const disconnectButton = document.getElementById("disconnectButton");

        const brightnessInput = document.getElementById("brightnessInput");
        const brightnessSlider = document.getElementById("brightnessSlider");
        const brightnessValue = document.getElementById("brightnessValue");

        const status = document.getElementById("status");

        // CONECTAR ARDUINO
        connectButton.addEventListener("click", async () => {
            try {
                port = await navigator.serial.requestPort();
                await port.open({ baudRate: 9600 });

                writer = port.writable.getWriter();

                connectButton.disabled = true;
                disconnectButton.disabled = false;

                brightnessInput.disabled = false;
                brightnessSlider.disabled = false;

                status.textContent = "Arduino conectado";
            } catch (error) {
                console.error(error);
                status.textContent = "No se pudo conectar";
            }
        });

        // FUNCIÓN PRINCIPAL DE ENVÍO Y SINCRONIZACIÓN
        async function updateAndSendBrightness(val, sourceElement) {
            let value = Number(val);

            if (isNaN(value)) return;

            if (value < 0) value = 0;
            if (value > 255) value = 255;

            // Sincronizar las entradas según la fuente de origen
            if (sourceElement !== brightnessInput) brightnessInput.value = value;
            if (sourceElement !== brightnessSlider) brightnessSlider.value = value;
            brightnessValue.textContent = value;

            // Enviar inmediatamente si el puerto está abierto
            if (writer) {
                try {
                    const data = new TextEncoder().encode(value + "\n");
                    await writer.write(data);
                    status.textContent = "Brillo actual: " + value;
                } catch (err) {
                    console.error("Error al enviar:", err);
                }
            }
        }

        // CAMBIOS EN TIEMPO REAL DESDE EL CAMPO NUMÉRICO
        brightnessInput.addEventListener("input", (e) => {
            updateAndSendBrightness(e.target.value, brightnessInput);
        });

        // CAMBIOS EN TIEMPO REAL DESDE EL DESLIZADOR (SLIDER)
        brightnessSlider.addEventListener("input", (e) => {
            updateAndSendBrightness(e.target.value, brightnessSlider);
        });

        // DESCONECTAR
        disconnectButton.addEventListener("click", async () => {
            try {
                if (writer) {
                    writer.releaseLock();
                    writer = null;
                }

                if (port) {
                    await port.close();
                    port = null;
                }

                connectButton.disabled = false;
                disconnectButton.disabled = true;

                brightnessInput.disabled = true;
                brightnessSlider.disabled = true;

                status.textContent = "Arduino desconectado";
            } catch (error) {
                console.error(error);
                status.textContent = "Error al desconectar";
            }
        });
    </script>

</body>
</html>
