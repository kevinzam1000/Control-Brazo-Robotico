<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Control de brillo Arduino</title>

    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: Arial, sans-serif;
            background: #f4f6f8;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        .container {
            background: white;
            width: 90%;
            max-width: 500px;
            padding: 35px;
            border-radius: 15px;
            box-shadow: 0 5px 20px rgba(0, 0, 0, 0.1);
        }

        h1 {
            text-align: center;
            margin-bottom: 10px;
            color: #222;
        }

        .description {
            text-align: center;
            color: #666;
            margin-bottom: 30px;
        }

        .control {
            margin-bottom: 25px;
        }

        label {
            display: block;
            margin-bottom: 8px;
            font-weight: bold;
            color: #333;
        }

        input[type="number"] {
            width: 100%;
            padding: 12px;
            border: 1px solid #ccc;
            border-radius: 8px;
            font-size: 16px;
        }

        input[type="range"] {
            width: 100%;
            margin-top: 10px;
            cursor: pointer;
        }

        button {
            width: 100%;
            padding: 14px;
            margin-top: 10px;
            border: none;
            border-radius: 8px;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
        }

        #connectButton {
            background: #222;
            color: white;
        }

        #sendButton {
            background: #2e7d32;
            color: white;
        }

        #disconnectButton {
            background: #c62828;
            color: white;
        }

        button:disabled {
            background: #ccc !important;
            cursor: not-allowed;
        }

        .value {
            text-align: center;
            font-size: 20px;
            font-weight: bold;
            margin-top: 10px;
        }

        .status {
            margin-top: 25px;
            padding: 12px;
            border-radius: 8px;
            background: #eee;
            color: #555;
            text-align: center;
        }
    </style>
</head>

<body>

    <div class="container">

        <h1>Control de brillo</h1>

        <p class="description">
            Control PWM del LED mediante comunicación serial
        </p>

        <!-- CONEXIÓN -->
        <button id="connectButton">
            Conectar Arduino
        </button>

        <!-- VALOR NUMÉRICO -->
        <div class="control">
            <label for="brightnessInput">
                Nivel de brillo (0 - 255)
            </label>

            <input
                type="number"
                id="brightnessInput"
                min="0"
                max="255"
                value="128"
                disabled
            >
        </div>

        <!-- BARRA -->
        <div class="control">

            <label for="brightnessSlider">
                Control de brillo
            </label>

            <input
                type="range"
                id="brightnessSlider"
                min="0"
                max="255"
                value="128"
                disabled
            >

            <div class="value">
                <span id="brightnessValue">128</span>
            </div>

        </div>

        <!-- ENVIAR -->
        <button id="sendButton" disabled>
            Aplicar brillo
        </button>

        <!-- DESCONECTAR -->
        <button id="disconnectButton" disabled>
            Desconectar Arduino
        </button>

        <!-- ESTADO -->
        <div class="status" id="status">
            Arduino desconectado
        </div>

    </div>


    <script>

        let port = null;
        let writer = null;


        // ELEMENTOS
        const connectButton = document.getElementById("connectButton");
        const sendButton = document.getElementById("sendButton");
        const disconnectButton = document.getElementById("disconnectButton");

        const brightnessInput = document.getElementById("brightnessInput");
        const brightnessSlider = document.getElementById("brightnessSlider");
        const brightnessValue = document.getElementById("brightnessValue");

        const status = document.getElementById("status");


        // CONECTAR ARDUINO
        connectButton.addEventListener("click", async () => {

            try {

                port = await navigator.serial.requestPort();

                await port.open({
                    baudRate: 9600
                });

                writer = port.writable.getWriter();

                connectButton.disabled = true;
                sendButton.disabled = false;
                disconnectButton.disabled = false;

                brightnessInput.disabled = false;
                brightnessSlider.disabled = false;

                status.textContent = "Arduino conectado";

            } catch (error) {

                console.error(error);

                status.textContent = "No se pudo conectar";

            }

        });


        // CAMBIAR VALOR DESDE EL CAMPO NUMÉRICO
        brightnessInput.addEventListener("input", () => {

            let value = Number(brightnessInput.value);

            if (value < 0) {
                value = 0;
                brightnessInput.value = 0;
            }

            if (value > 255) {
                value = 255;
                brightnessInput.value = 255;
            }

            brightnessSlider.value = value;
            brightnessValue.textContent = value;

        });


        // CAMBIAR VALOR DESDE LA BARRA
        brightnessSlider.addEventListener("input", () => {

            const value = brightnessSlider.value;

            brightnessInput.value = value;
            brightnessValue.textContent = value;

        });


        // ENVIAR BRILLO
        sendButton.addEventListener("click", async () => {

            if (!writer) return;

            const value = Number(brightnessInput.value);

            const data = new TextEncoder().encode(value + "\n");

            await writer.write(data);

            status.textContent = "Brillo enviado: " + value;

        });


        // DESCONECTAR
        disconnectButton.addEventListener("click", async () => {

            try {

                if (writer) {
                    writer.releaseLock();
                    writer = null;
                }

                if (port) {
                    await port.close();
                    port = null;
                }

                connectButton.disabled = false;
                sendButton.disabled = true;
                disconnectButton.disabled = true;

                brightnessInput.disabled = true;
                brightnessSlider.disabled = true;

                status.textContent = "Arduino desconectado";

            } catch (error) {

                console.error(error);

                status.textContent = "Error al desconectar";

            }

        });

    </script>

</body>
</html>
